[package]
name = "prime"
version = "0.1.0"
edition = "2024"

[features]
dual_sync = []

[dev-dependencies]
rstest = "0.26.1"

[dependencies]
async-trait = "0.1.89"
bincode = { version = "2.0.1", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
sea-orm = { version = "1.1.19", features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
